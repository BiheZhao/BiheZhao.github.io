# Venue abbreviations used in `abbr` fields of _bibliography/papers.bib.
# Each gets a colored badge and a link on the publications page.
# Palette: Nature Publishing Group (as in ggsci `pal_npg`).
"ICLR":
  url: https://iclr.cc/
  color: "#3C5488" # NPG navy

"ICML":
  url: https://icml.cc/
  color: "#E64B35" # NPG red

"NeurIPS":
  url: https://neurips.cc/
  color: "#00A087" # NPG teal green

"ECCV":
  url: https://eccv.ecva.net/
  color: "#4DBBD5" # NPG cyan

"EMNLP":
  url: https://2026.emnlp.org/
  color: "#7E6148" # NPG brown

"IEEE SPL":
  url: https://signalprocessingsociety.org/publications-resources/ieee-signal-processing-letters
  color: "#8491B4" # NPG slate blue
